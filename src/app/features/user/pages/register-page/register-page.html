<section class="register__container">
    <form class="register__form" action="">
        <div class="register__form-name-wrapper">
            <input class="register__form-name-input" type="text" placeholder="Enter username">
        </div>

        <div class="register__form-email-wrapper">
            <input class="register__form-email-input" type="text" placeholder="Enter email">
        </div>

        <div class="register__form-password-wrapper">
            <input class="register__form-password-input" type="text" placeholder="Enter password">
        </div>

        <div class="register__form-submit-wrapper">
            <button class="register__form-submit" type="submit">
                Підтвердити
            </button>
        </div>
    </form>
</section>
