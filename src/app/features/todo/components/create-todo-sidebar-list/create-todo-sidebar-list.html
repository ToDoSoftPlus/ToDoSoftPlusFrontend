<div class="create-todo-sidebar-list flex items-center mt-2 px-1 py-1">
    <img class="create-todo-sidebar-list__image mr-2" src="ListIcon.png" alt="List icon" width="28px">
    <form class="create-todo-sidebar-list__form" (submit)="onSubmitForm($event)" (keydown.escape)="onCancel.emit()">
        <input class="create-todo-sidebar-list__input-title" type="text" [formField]="createSidebarListForm.title"
            (blur)="onCancel.emit()" appAutofocus>
    </form>
</div>
